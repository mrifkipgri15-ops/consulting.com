function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1}),n=new Map();document.querySelectorAll('#content :is(.kicker,h1,h2,.hero p,section>p,.btns,.card,.item,.ph,.facts li,.band p,.band .btn)').forEach(el=>{const k=el.parentElement,i=n.get(k)||0;n.set(k,i+1);el.style.setProperty('--d',Math.min(i,6)*.09+'s');el.classList.add('rv');io.observe(el)})}
const clean=()=>{const c=$('#content').cloneNode(true);c.querySelectorAll('.x').forEach(x=>x.remove());c.querySelectorAll('[data-wa]').forEach(a=>['href','target','rel','hidden','data-a'].forEach(k=>a.removeAttribute(k)));c.removeAttribute('contenteditable');return c.innerHTML};
const capture=()=>{const p=S.pages.find(x=>x.id===shown);if(p&&$('#content'))p.html=clean()};
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000)};
const modal=h=>{$('#md').innerHTML=`<div class="ov"><div class="md">${h}</div></div>`};
const close=()=>{$('#md').innerHTML=''};
function dec(){const c=$('#content');c.contentEditable='true';c.querySelectorAll('section,.card,.item,.band').forEach(el=>{if(!el.querySelector(':scope>.x')){const b=document.createElement('button');b.className='x';b.contentEditable='false';b.textContent='×';el.appendChild(b)}})}
function render(go){
  css();if(!S.pages.find(x=>x.id===cur))cur=S.pages[0].id;
  const p=S.pages.find(x=>x.id===cur);shown=p.id;
  const lk=c=>S.pages.map(x=>`<a href="#${x.id}"${c&&x.id===cur?' class="on"':''}>${esc(x.title)}</a>`).join('');
  $('#app').innerHTML=`<header class="nav${scrollY>8?' sc':''}"><a class="brand" href="#${S.pages[0].id}">${esc(S.brand)}</a><nav>${lk(1)}</nav>${me?'':'<button class="lg" data-a="login">Login</button>'}</header><main id="content">${p.html}</main><footer><b>${esc(S.brand)}</b><nav>${lk(0)}</nav><small>© ${new Date().getFullYear()} ${esc(S.brand)}</small></footer>${wab()}<div id="md"></div><div id="ts"></div>${me?`<div class="bar"><span>${esc(me)}</span><button class="btn sm ${editing?'on':''}" data-a="edit">${editing?'Simpan':'✎ Edit'}</button>${editing?'<button class="btn sm" data-a="addtext">+ Teks</button><button class="btn sm" data-a="addgrid">+ Grid</button><button class="btn sm" data-a="addcard">+ Kartu</button><button class="btn sm" data-a="addimg">+ Foto</button>':''}<button class="btn sm" data-a="pages">Halaman</button><button class="btn sm" data-a="look">Tampilan</button><button class="btn sm" data-a="users">Akun</button><button class="btn sm" data-a="out">Keluar</button></div>`:''}`;
  wal();if(editing)dec();else reveal();
}
async function persist(){
  S.ts=Date.now();
  try{localStorage.setItem('draft',JSON.stringify(S))}catch(e){}
  try{const a=await claude.use('artifact');if(a){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#dyn').textContent='';c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');await a.publish('<!DOCTYPE html>'+c.outerHTML);return 'published'}}catch(e){}
  return 'draft'
}
async function commit(){const r=await persist();close();render();toast(r==='published'?'Tersimpan & terpublikasi':'Tersimpan sebagai draf di perangkat ini')}
const syncP=()=>document.querySelectorAll('.pt').forEach(i=>W[i.dataset.i].title=i.value||'Tanpa judul');
function drawPages(){modal(`<h3>Halaman</h3>${W.map((p,i)=>`<div class="row"><input class="pt" data-i="${i}" value="${esc(p.title)}"><button class="btn ghost sm" data-a="pdel" data-i="${i}">Hapus</button></div>`).join('')}<div class="row"><input id="np" placeholder="Nama halaman baru"><button class="btn ghost sm" data-a="padd">Tambah</button></div><p></p><button class="btn" data-a="psave">Simpan</button> <button class="btn ghost" data-a="close">Batal</button>`)}
function drawUsers(){modal(`<h3>Akun</h3>${W.map((u,i)=>`<div class="row ur" data-i="${i}"><b style="min-width:84px">${esc(u.u)}</b><select><option ${u.role=='admin'?'selected':''}>admin</option><option ${u.role=='manajer'?'selected':''}>manajer</option></select><input type="password" placeholder="password baru (opsional)">${u.u===me?'':`<button class="btn ghost sm" data-a="udel" data-i="${i}">Hapus</button>`}</div>`).join('')}<h3 style="margin-top:14px">Tambah akun</h3><input id="nu" placeholder="Username"><input id="npw" type="password" placeholder="Password"><select id="nr"><option>manajer</option><option>admin</option></select><p class="err" id="ue"></p><button class="btn" data-a="usave">Simpan</button> <button class="btn ghost" data-a="close">Batal</button>`)}
document.addEventListener('click',async e=>{
  if(e.target.classList.contains('ov'))return close();
  const x=e.target.closest('.x');if(x){x.parentElement.remove();return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
  if(a==='close')close();
  else if(a==='login')modal(`<h3>Masuk</h3><input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><p class="err" id="le"></p><button class="btn" data-a="dologin">Masuk</button> <button class="btn ghost" data-a="close">Batal</button>`);
  else if(a==='dologin'){const u=S.users.find(x=>x.u===$('#lu').value.trim());if(u&&u.h===await sha($('#lp').value)){me=u.u;try{sessionStorage.setItem('me',me)}catch(e){}render()}else $('#le').textContent='Username atau password salah.'}
  else if(a==='out'){me=null;editing=false;try{sessionStorage.removeItem('me')}catch(e){}render()}
  else if(a==='edit'){if(editing){capture();editing=false;await commit()}else{editing=true;render()}}
  else if(a==='addtext'){$('#content').insertAdjacentHTML('beforeend',"<section><h2>Judul baru</h2><p>Tulis isi di sini…</p></section>");dec()}
  else if(a==='addgrid'){$('#content').insertAdjacentHTML('beforeend',"<section><h2>Judul baru</h2><div class='grid'>"+"<div class='card'><h3>Judul</h3><p>Deskripsi</p></div>".repeat(3)+"</div></section>");dec()}
  else if(a==='addcard'){const g=[...$('#content').querySelectorAll('.grid')].pop();if(g){g.insertAdjacentHTML('beforeend',"<div class='card'><h3>Judul</h3><p>Deskripsi</p></div>");dec()}else toast('Belum ada grid, klik + Grid dulu')}
  else if(a==='pages'){if(editing)capture();W=S.pages.map(p=>({...p}));drawPages()}
  else if(a==='pdel'){syncP();if(W.length>1){W.splice(i,1);drawPages()}}
  else if(a==='padd'){syncP();const n=$('#np').value.trim();if(n){W.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,5),title:n,html:`<section><h2>${esc(n)}</h2><p>Tulis isi halaman di sini.</p></section>`});drawPages()}}
  else if(a==='psave'){syncP();S.pages=W;await commit()}
  else if(a==='look')modal(`<h3>Tampilan</h3><label>Nama brand</label><input id="br" value="${esc(S.brand)}"><label>Latar belakang</label><div class="row">${PRE.map((p,k)=>`<div class="sw" title="${p[0]}" data-a="pre" data-i="${k}" style="background:${p[1]}"></div>`).join('')}</div><div class="row"><input id="c1" type="color" value="#e9f2f1"><input id="c2" type="color" value="#f8f6f1"><button class="btn ghost sm" data-a="cust">Pakai warna ini</button></div><div class="row"><button class="btn ghost sm" data-a="bgfoto">Tempel foto latar</button><button class="btn ghost sm" data-a="bgrm">Hapus foto</button></div><label>Ketebalan overlay putih di atas foto</label><input id="ov" type="range" min="0" max="0.95" step="0.05" value="${S.ov??.6}"><label>Nomor WhatsApp (08xx atau 628xx)</label><input id="wa" type="tel" inputmode="tel" placeholder="08123456789" value="${esc(S.wa||'')}"><label>Pesan otomatis saat chat dibuka</label><input id="wam" value="${esc(S.wam??'Halo, saya ingin konsultasi pajak.')}"><label>Warna utama</label><input id="ac" type="color" value="${S.ac||'#0e4d64'}"><p></p><button class="btn" data-a="lsave">Simpan</button> <button class="btn ghost" data-a="close">Tutup</button>`);
  else if(a==='bgfoto')pick(1920,u=>{S.img=u;css()});
  else if(a==='bgrm'){S.img='';css()}
  else if(a==='addimg')pick(1400,u=>{$('#content').insertAdjacentHTML('beforeend',`<section><img class="ph" alt="" src="${u}"></section>`);dec()});
  else if(a==='pre'){S.bg=PRE[i][1];css()}
  else if(a==='cust'){S.bg=`linear-gradient(160deg,${$('#c1').value},${$('#c2').value})`;css()}
  else if(a==='lsave'){S.brand=$('#br').value.trim()||S.brand;S.ac=$('#ac').value;S.wa=$('#wa').value.trim();S.wam=$('#wam').value;await commit()}
  else if(a==='users'){W=S.users.map(u=>({...u}));drawUsers()}
  else if(a==='udel'){W.splice(i,1);drawUsers()}
  else if(a==='usave'){
    document.querySelectorAll('.ur').forEach(r=>{const u=W[r.dataset.i];u.role=r.querySelector('select').value;const pw=r.querySelector('input').value;if(pw)u.pw=pw});
    const nu=$('#nu').value.trim(),np=$('#npw').value;
    if(nu){if(!np)return $('#ue').textContent='Isi password untuk akun baru.';if(W.find(u=>u.u===nu))return $('#ue').textContent='Username sudah ada.';W.push({u:nu,pw:np,role:$('#nr').value})}
    if(!W.some(u=>u.role==='admin'))return $('#ue').textContent='Harus ada minimal satu admin.';
    for(const u of W){if(u.pw){u.h=await sha(u.pw);delete u.pw}}
    S.users=W;await commit()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp')document.querySelector('[data-a=dologin]').click()});
addEventListener('hashchange',async()=>{if(editing)capture();const c=$('#content'),b=$('#pb');b.style.opacity=1;b.style.width='65%';c&&c.classList.add('out');await new Promise(r=>setTimeout(r,240));cur=location.hash.slice(1)||S.pages[0].id;render(true);scrollTo(0,0);b.style.width='100%';setTimeout(()=>{b.style.opacity=0;setTimeout(()=>b.style.width='0',300)},250)});
addEventListener('scroll',()=>{const n=$('.nav');n&&n.classList.toggle('sc',scrollY>8)},{passive:true});
document.addEventListener('input',e=>{if(e.target.id==='ov'){S.ov=+e.target.value;css()}});
render();
</script>
</body></html>
